[package]
name = "flynotes-ai-control-center"
version = "0.1.0"
description = "Flynotes local AI control center"
authors = ["Flynotes"]
edition = "2021"

[lib]
name = "flynotes_ai_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
