[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flynotes-local-agent"
version = "0.1.0"
description = "Local control plane for Flynotes desktop, ComfyUI, and Blender"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psutil>=7,<8",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.14,<7",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
flynotes-agent = "flynotes_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["agent/flynotes_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["agent/tests"]
asyncio_mode = "auto"
